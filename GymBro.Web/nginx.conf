# Etapa 13: servidor de la PWA. HTTPS lo termina el proxy o el servicio de la nube delante de este contenedor
# (obligatorio para el service worker y la camara; ver docs/despliegue.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: mismo origen que el cliente (como el proxy de desarrollo de ng serve), sin CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker y su manifiesto: siempre revalidar, para que una version nueva llegue enseguida.
    location = /ngsw-worker.js     { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /ngsw.json          { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /safety-worker.js   { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /worker-basic.min.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /index.html         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Archivos con huella en el nombre (los genera ng build): cache larga.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas del cliente (por ejemplo /mi/historial/123): index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
