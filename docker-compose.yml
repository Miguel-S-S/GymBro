version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gymbro_db
    environment:
      POSTGRES_USER: gymbro_user
      POSTGRES_PASSWORD: gymbro_password
      POSTGRES_DB: gymbro_db
    ports:
      - "5432:5432"
    volumes:
      - gymbro_db_data:/var/lib/postgresql/data
    networks:
      - gymbro_network
    restart: unless-stopped

networks:
  gymbro_network:
    driver: bridge

volumes:
  gymbro_db_data:
